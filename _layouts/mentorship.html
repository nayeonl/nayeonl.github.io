---
layout: default
---
<div class="container" style="padding-top: 4rem;">
  <h1>{{ page.heading }} <span class="highlight">{{ page.highlight }}</span></h1>
  <p>{{ page.lead }}</p>

  <div class="grid-2" style="grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2rem;">
    <div>
      <div class="markdown-content">
        {{ page.left_column | markdownify }}
      </div>
    </div>

    <div>
      <div class="markdown-content">
        {{ page.right_column | markdownify }}
      </div>
    </div>
  </div>
</div>
